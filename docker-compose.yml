version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: swasthyasurge-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - RANDOM_SEED=20260911
      - DATABASE_URL=sqlite:///./swasthyasurge.db
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./plots:/app/plots
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swasthyasurge-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
